[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pickem"
version = "0.1.0"
description = "CS2 Major Pick'Em predictor (VRS + HLTV + form, Swiss Monte Carlo)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "pyyaml>=6.0",
  "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=4.9", "tabulate>=0.9",
]

[project.optional-dependencies]
hltv = ["curl_cffi>=0.7"]
dev = ["pytest>=7"]

[project.scripts]
pickem = "pickem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
