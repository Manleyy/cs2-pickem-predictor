# PGL Major Singapore 2026 - Stage 1 (24-27 November 2026)
tournament:
  name: "PGL Major Singapore 2026 - Stage 1"
  date: "2026-11-24"          # features use only data from before this date
  # Seed order (1 = top seed). Names as announced; aliases below map them to VRS/HLTV names.
  seeds:
    - Ninjas in Pyjamas
    - PVISION
    - HEROIC
    - FaZe Clan
    - Team Liquid
    - Eternal Fire
    - 100 Thieves
    - 9z Team
    - M80
    - DENDELE CS
    - Imperial Esports
    - Wildcard
    - GOSH
    - FlyQuest
    - Chinggis Warriors
    - Lynn Vision Gaming
  # Round 1 as published (seed i vs seed i+8). Leave empty to auto-generate 1v9, 2v10 ...
  round1:
    - [HEROIC, Imperial Esports]
    - [9z Team, Lynn Vision Gaming]
    - [Ninjas in Pyjamas, M80]
    - [100 Thieves, Chinggis Warriors]
    - [PVISION, DENDELE CS]
    - [Team Liquid, GOSH]
    - [FaZe Clan, Wildcard]
    - [Eternal Fire, FlyQuest]
  # Results already played (fill in as Stage 1 progresses, then re-run `pickem simulate`)
  # Each entry: [winner, loser]. Order matters: round by round.
  played: []

swiss:
  wins_to_advance: 3
  losses_to_eliminate: 3
  bo3_for_decider: true       # Bo3 when a match can advance or eliminate a team
  n_sims: 100000

pickem:
  n_3_0: 2
  n_0_3: 2
  n_advance: 6
  advance_counts_3_0: false   # Valve: advance picks must finish 3-1 or 3-2
  coin_threshold: 5           # correct picks needed for the coin upgrade
  locked: {}                  # e.g. {"3-0": [HEROIC], "advance": [FaZe Clan]} to force picks

aliases:                       # announced name -> name used by VRS/HLTV
  PVISION: PARIVISION
  FaZe Clan: FaZe
  Team Liquid: Liquid
  9z Team: 9z
  DENDELE CS: DENDELE
  Imperial Esports: Imperial
  GOSH: BC.Game                # renamed from BC.Game; VRS/HLTV still list the old name
  Lynn Vision Gaming: Lynn Vision

features:
  form_window_days: 90
  form_half_life_days: 30
  form_prior_matches: 3        # shrinks teams with few recent games toward 0
  hltv_max_age_days: 45        # ignore HLTV rankings older than this for a match
  hltv_weight_if_no_history: 0.5   # see README: "consensus" mode
  elo_k: 48                    # live Elo: rating change per series (tested 16-96, 48 was best)
  elo_revert: 0.1              # at each monthly VRS release, pull Elo 10% back toward VRS points
  elo_new_boost: 0.0           # extra K for teams with few matches (tested; no gain at Majors)
  short_form_window_days: 30
  short_form_half_life_days: 10

model:
  train_from: "2024-09-01"
  test_from: "2026-05-01"      # time split for validation
  max_vrs_rank: 250            # train on matches between teams ranked inside this
  C: 1.0
  series_is_bo3: true          # treat training series as Bo3 when converting to Bo1
  bo1_stretch: 1.6             # Bo1 log-odds x1.6 (finding from Leclowndu93150/pickem-prediction-model,
                               # confirmed by our backtest: 1.0 -> 1.6 improves every stage score)
  # Inputs to the model. Available: vrs_diff, form_diff, sos_diff, elo_diff, h2h,
  # region_americas, region_asia, xreg_diff, form_short_diff, activity_diff
  # (hltv_diff is handled by use_hltv below)
  # Chosen by the general test AND the past-Majors backtest (python -m pickem backtest).
  # form_diff and sos_diff help on everyday matches but hurt at Majors, so they are off.
  features: [vrs_diff, elo_diff, h2h, region_americas, region_asia]
  region_scale: 1.0            # multiply the learned region penalty (0 = off, 0.5 = half, 1.5 = 50% stronger)
  use_hltv: auto               # auto = keep HLTV rank only if it improves validation; yes / no to force
